[package]
name = "ggboy_lending"
version = "0.1.0"
description = "GGBOY collateralized lending market"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
# 同时生成 Solana 可加载产物和可作为 Rust 依赖使用的库。
# Build both the Solana-loadable artifact and a reusable Rust library.
crate-type = ["cdylib", "lib"]

[features]
default = []
# CPI 调用方通过该特性依赖本 crate，同时禁用独立入口点。
# CPI consumers can depend on this crate without compiling a second entrypoint.
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# Anchor CLI 生成此程序的接口描述时启用该特性。
# The Anchor CLI enables this feature to generate this program's IDL.
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true

[lints.rust]
# 向宿主编译器声明 Anchor 使用的 Solana 目标条件。
# Register the Solana target condition used by Anchor with the host compiler.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
