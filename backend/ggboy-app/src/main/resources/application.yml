spring:
  application:
    name: ggboy-backend
  datasource:
    # JDBC 地址和用户名从环境变量读取，默认连接本地开发库。
    # Read the JDBC URL and username from the environment, defaulting to a local development database.
    url: "${GGBOY_DB_URL:jdbc:postgresql://localhost:5432/ggboy}"
    username: "${GGBOY_DB_USER:ggboy}"
    # 密码由启动环境提供，仓库不保存真实凭据。
    # Supply the password at runtime and keep credentials out of version control.
    password: "${GGBOY_DB_PASSWORD:}"
  flyway:
    # Flyway 在应用启动时加载版本化迁移。
    # Flyway loads versioned migrations during application startup.
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    # 读取完整行时按列名匹配 record 构造参数，避免调整 SELECT 的列顺序后发生错位。
    # Bind record constructor arguments by column name so reordered full-row projections still map correctly.
    arg-name-based-constructor-auto-mapping: true
    # 对应 PostgreSQL 的 snake_case 列名与 Java 的 camelCase 参数名。
    # Match PostgreSQL snake_case column names to Java camelCase parameter names.
    map-underscore-to-camel-case: true

ggboy:
  devnet-vault-indexer:
    # 仅为已登记的 Devnet 金库同步存赎活动。 / Sync deposits and redemptions only for registered Devnet vaults.
    enabled: "${GGBOY_DEVNET_VAULT_INDEXER_ENABLED:true}"
    # 只读 RPC 地址，可切换到具备 Devnet 历史的节点。 / Read-only RPC URL, replaceable with a node retaining Devnet history.
    rpc-url: "${GGBOY_DEVNET_VAULT_RPC_URL:https://api.devnet.solana.com}"
    # 与金库 IDL 相同的 Devnet 部署程序 ID。 / The same Devnet deployment program ID as the vault IDL.
    program-id: "${GGBOY_DEVNET_VAULT_PROGRAM_ID:FjDzSyVW7P349yHXmhazzz2d3wXkTdDvNYcMrC4HZK75}"
    # 每轮结束后的等待时间，默认 20 秒。 / Delay after each pass, 20 seconds by default.
    poll-interval: "${GGBOY_DEVNET_VAULT_POLL_INTERVAL:20s}"
  devnet-lending-indexer:
    # 同步登记市场的四类借款人活动。 / Index four borrower activity types for registered markets.
    enabled: "${GGBOY_DEVNET_LENDING_INDEXER_ENABLED:true}"
    # 与借贷 IDL 相同的 Devnet 部署程序公钥。 / Public key matching the Devnet deployment in the lending IDL.
    program-id: "${GGBOY_DEVNET_LENDING_PROGRAM_ID:8cxYWp74a83XZMEDMMdiRPAcvWcCkajMwpCSGehoQu4H}"
    # 每轮结束后的等待时间，默认 20 秒。 / Delay after each pass, 20 seconds by default.
    poll-interval: "${GGBOY_DEVNET_LENDING_POLL_INTERVAL:20s}"
  devnet-vault-snapshot:
    # 定时观测已登记的 Devnet 纯现金金库。 / Periodically sample registered Devnet cash vaults.
    enabled: "${GGBOY_DEVNET_VAULT_SNAPSHOT_ENABLED:true}"
    # 每轮完成后再次采集的延迟，默认 30 秒。 / Delay before the next capture pass, 30 seconds by default.
    poll-interval: "${GGBOY_DEVNET_VAULT_SNAPSHOT_POLL_INTERVAL:30s}"
  vault:
    # 金库及钱包持仓快照在观测超过此秒数时标记为过期。
    # Mark vault and wallet position snapshots stale after this number of seconds from observation.
    snapshot-stale-after-seconds: "${GGBOY_VAULT_SNAPSHOT_STALE_AFTER_SECONDS:60}"
  lending:
    # 借贷市场和钱包仓位快照的最大新鲜时长，单位为秒，须为正数。
    # Maximum fresh age for lending market and wallet snapshots in seconds, required to be positive.
    snapshot-stale-after-seconds: "${GGBOY_LENDING_SNAPSHOT_STALE_AFTER_SECONDS:60}"

springdoc:
  # 文档仅收录业务 HTTP 接口。
  # Include only business HTTP interfaces in the API documentation.
  paths-to-match: /api/v1/**
  api-docs:
    # 使用同一个开关控制 OpenAPI 文档及 Swagger UI。
    # Use one switch for both the OpenAPI document and Swagger UI.
    enabled: "${GGBOY_SWAGGER_ENABLED:true}"
  swagger-ui:
    enabled: "${GGBOY_SWAGGER_ENABLED:true}"
    # 支持在页面中筛选业务分组，默认打开本项目的接口文档。
    # Enable filtering by business group and open this project's API documentation by default.
    filter: true
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        # 仅暴露基础健康检查。
        # Expose only the basic health check.
        include: health
